<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ShopDaCris - Autorização</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; background: #f5f5f5; color: #222; margin: 0; padding: 16px; }
  .card { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  code { display: block; word-break: break-all; background: #f0f0f0; padding: 12px; border-radius: 6px; margin: 12px 0; font-size: 14px; }
  p { line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>ShopDaCris - Autorização do Mercado Livre</h1>
  <div id="conteudo"></div>
</div>
<script>
  (function () {
    var el = document.getElementById('conteudo');
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var erro = params.get('error');
    function texto(tag, t) { var e = document.createElement(tag); e.textContent = t; return e; }
    if (code) {
      el.appendChild(texto('p', 'Autorização recebida. Copie o código abaixo e envie para o sistema:'));
      var c = document.createElement('code');
      c.textContent = code;
      el.appendChild(c);
      el.appendChild(texto('p', 'O código vale por pouco tempo. Se demorar, faça a autorização de novo.'));
    } else if (erro) {
      el.appendChild(texto('p', 'O Mercado Livre retornou um erro: ' + erro));
    } else {
      el.appendChild(texto('p', 'Esta página recebe o retorno da autorização do Mercado Livre. Não há nada a fazer aqui por enquanto.'));
    }
  })();
</script>
</body>
</html>
